<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="aedEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332" />
      <stop offset="60%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#40916C" />
    </linearGradient>
    <linearGradient id="aedMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#74C69D" />
    </linearGradient>
    <linearGradient id="aedGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7A501" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1B4332" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="112" fill="#E8F3EE" />
  
  <!-- Subtle Architectural Rings (Scanning & Convergence) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#D0DDD6" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="#BBF7D0" stroke-width="3" opacity="0.5" />

  <!-- Main Return Infinity & Location Beacon Loop -->
  <g filter="url(#softGlow)">
    <!-- Outer Shield / Loop Path -->
    <path d="M256 96 C167.6 96 96 167.6 96 256 C96 322.2 136.2 379 193.3 402.5 L240 420 C250.3 424.1 261.7 424.1 272 420 L318.7 402.5 C375.8 379 416 322.2 416 256 C416 167.6 344.4 96 256 96 Z" fill="url(#aedEmerald)" />
    
    <!-- Dynamic Return Sweep Arc (representing found & returning) -->
    <path d="M160 256 C160 203 203 160 256 160 C309 160 352 203 352 256 C352 309 309 352 256 352" fill="none" stroke="url(#aedMint)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Pulse Target Spark (AI Precision Match) -->
    <circle cx="256" cy="256" r="32" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="18" fill="url(#aedGold)" />
    <circle cx="256" cy="256" r="7" fill="#FFFFFF" />

    <!-- Return Arrow Indicator Head -->
    <path d="M226 352 L266 324 L266 380 Z" fill="url(#aedMint)" />
    
    <!-- AI Sparkles -->
    <path d="M366 146 L372 162 L388 168 L372 174 L366 190 L360 174 L344 168 L360 162 Z" fill="url(#aedGold)" />
    <path d="M140 180 L144 190 L154 194 L144 198 L140 208 L136 198 L126 194 L136 190 Z" fill="url(#aedMint)" opacity="0.9" />
  </g>
</svg>
